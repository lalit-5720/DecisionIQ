server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # uploads go through /api/pipeline/upload (the API enforces its own 250 MB limit)
    client_max_body_size 260m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # hashed build assets can be cached for a long time.
    # (nginx drops server-level add_header lines in any location that sets its own add_header, so use `expires` here.)
    location /assets/ {
        expires 30d;
    }

    # single-page app: unknown paths fall back to index.html (client-side routing)
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
